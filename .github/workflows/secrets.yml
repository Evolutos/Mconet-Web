name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

# Secret scanning reads repository contents and does not require write permissions.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0

      - name: Scan repository
        run: node scripts/check-secrets.mjs

      - name: Verify leak detection
        run: node scripts/check-secrets.mjs --self-test
