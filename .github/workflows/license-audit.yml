name: License Audit

on:
  pull_request:
  push:
    branches:
      - main

# License auditing only reads repository contents and installed package metadata.
permissions:
  contents: read

jobs:
  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Read the exact pnpm version from the root packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency licenses
        run: pnpm security:licenses
